name: history
on:
  schedule:
    - cron: "17 6,12,18 * * *"   # 09:17, 15:17, 21:17 Addis time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build history and trends
        run: python3 scripts/build_history.py
      - name: Commit if changed
        run: |
          git config user.name "birrwatch-bot"
          git config user.email "bot@birrwatch.local"
          git add data
          git diff --cached --quiet || git commit -m "history: $(date -u +%F)"
          git push