name: collector
on:
  schedule:
    - cron: "23 5,8,11 * * *"   # 08:23, 11:23, 14:23 Addis time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser libraries
        run: pip install requests beautifulsoup4
      - name: Collect bank rates
        run: python3 scripts/collector.py
      - name: Commit updated rates
        run: |
          git config user.name "birrwatch-bot"
          git config user.email "bot@birrwatch.local"
          git add data/rates.json
          git diff --cached --quiet || git commit -m "rates: robot collection $(date -u +%FT%TZ)"
          git push